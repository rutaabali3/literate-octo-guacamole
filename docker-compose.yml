version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: pulseforge-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: pulseforge_fitness
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pulseforge-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/pulseforge_fitness
      - JWT_ACCESS_SECRET=pulseforge_jwt_access_super_secret_key_minimum_64_bytes_secure_signature_ok
      - JWT_REFRESH_SECRET=pulseforge_jwt_refresh_super_secret_key_minimum_64_bytes_secure_signature_ok
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - CLIENT_ORIGIN=http://localhost:5173
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pulseforge-client
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  mongo_data:
